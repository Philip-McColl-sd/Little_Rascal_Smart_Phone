version = 1

# Case design files: STEP, 3MF, STL, drawings, renders, print profiles
[[annotations]]
path = "hardware/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Philip McColl"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Documentation and images
[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "docs/**", ".gitattributes", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Philip McColl"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The Little Rascal name and logo are not under an open licence
[[annotations]]
path = ["docs/little-rascal-logo*.png", "docs/video-preview.png"]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Philip McColl"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"
